user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Upstream services
    upstream qwen36 {
        server qwen36:8000;
    }

    upstream phi4mini {
        server phi4mini:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Router status
        location /status {
            access_log off;
            return 200 '{"status":"ok","qwen36":"http://localhost:8001","phi4mini":"http://localhost:8002"}\n';
            add_header Content-Type application/json;
        }

        # Primary model: Qwen 3.6 (stronger reasoning)
        location ~ ^/api/qwen(/|$) {
            proxy_pass http://qwen36;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Streaming support
            chunked_transfer_encoding on;
        }

        # Fallback model: Phi-4 mini (faster, lightweight)
        location ~ ^/api/phi(/|$) {
            proxy_pass http://phi4mini;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Streaming support
            chunked_transfer_encoding on;
        }

        # Direct proxy to Qwen (port 8001)
        location /v1/qwen {
            proxy_pass http://qwen36;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Direct proxy to Phi (port 8002)
        location /v1/phi {
            proxy_pass http://phi4mini;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Root redirect
        location / {
            return 302 /status;
        }
    }
}
