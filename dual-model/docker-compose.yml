version: '3.9'

services:
  qwen36:
    image: ollama/ollama:latest
    container_name: qwen36
    ports:
      - "8001:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=4
    volumes:
      - qwen36_models:/root/.ollama/models
    restart: unless-stopped

  phi4mini:
    image: ollama/ollama:latest
    container_name: phi4mini
    ports:
      - "8002:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=2
    volumes:
      - phi4mini_models:/root/.ollama/models
    restart: unless-stopped

volumes:
  qwen36_models:
  phi4mini_models:

networks:
  default:
    name: dual-model-network
