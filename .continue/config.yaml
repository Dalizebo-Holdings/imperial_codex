# ============================================================
# Continue.dev — imperial_codex Workspace Config
# Format: config.yaml (v2 YAML format)
# Last updated: 2026-07-24
#
# Model tiers:
#   1. Local (Ollama via dual-model router) — free, private
#   2. Cloud (OpenAI, Anthropic) — paid, powerful
#   3. Embeddings — local Ollama vector search
#
# MCP servers pull tools from the Imperial Codex MCP server
# plus standard filesystem, git, sequential-thinking, brave
# search, github, slack, and time servers.
# ============================================================

# ----------------------------------------------------------
# MODELS — Chat & Agent
# ----------------------------------------------------------
models:
  # ---- Local models (dual-model router on :8000) ----------
  - name: Qwen 2.5 7B (Local)
    provider: openai
    model: qwen2.5:7b-instruct
    apiBase: http://localhost:8000/v1
    apiKey: ollama
    roles:
      - chat
      - edit
      - agent
    contextLength: 8192
    completionOptions:
      temperature: 0.7
      maxTokens: 2048

  - name: Phi-4 Mini (Local)
    provider: openai
    model: phi4-mini
    apiBase: http://localhost:8000/v1
    apiKey: ollama
    roles:
      - chat
      - edit
      - agent
    contextLength: 4096
    completionOptions:
      temperature: 0.7
      maxTokens: 1024

  # ---- Cloud models (OpenAI) --------------------------------
  - name: GPT-4o
    provider: openai
    model: gpt-4o
    apiKey: $OPENAI_API_KEY
    roles:
      - chat
      - edit
      - agent
    contextLength: 128000
    completionOptions:
      temperature: 0.3
      maxTokens: 4096

  - name: GPT-4o Mini
    provider: openai
    model: gpt-4o-mini
    apiKey: $OPENAI_API_KEY
    roles:
      - chat
      - edit
    contextLength: 128000
    completionOptions:
      temperature: 0.3
      maxTokens: 2048

  # ---- Cloud models (Anthropic) ----------------------------
  - name: Claude 3.5 Sonnet
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    apiKey: $ANTHROPIC_API_KEY
    roles:
      - chat
      - edit
      - agent
    contextLength: 200000
    completionOptions:
      temperature: 0.3
      maxTokens: 8192

  - name: Claude 3 Haiku
    provider: anthropic
    model: claude-3-haiku-20240307
    apiKey: $ANTHROPIC_API_KEY
    roles:
      - chat
      - edit
    contextLength: 200000
    completionOptions:
      temperature: 0.3
      maxTokens: 2048

# ----------------------------------------------------------
# TAB AUTOCOMPLETE MODEL
# ----------------------------------------------------------
tabAutocompleteModel:
  name: Phi-4 Mini Autocomplete
  provider: openai
  model: phi4-mini
  apiBase: http://localhost:8000/v1
  apiKey: ollama
  contextLength: 2048
  completionOptions:
    temperature: 0.1
    maxTokens: 256

# ----------------------------------------------------------
# EMBEDDINGS — for @codebase and @docs indexing
# ----------------------------------------------------------
embeddingsProvider:
  provider: openai
  model: qwen2.5:7b-instruct
  apiBase: http://localhost:8001/v1
  apiKey: ollama

# ----------------------------------------------------------
# MCP SERVERS — tools exposed to chat & agent modes
# ----------------------------------------------------------
mcpServers:
  # Imperial Codex own MCP (13 tools: Pillars, OS Modules,
  # Library, Strike Output, Capital Allocation, etc.)
  - name: imperial-codex
    command: node
    args:
      - "--loader"
      - "ts-node/esm"
      - "--experimental-specifier-resolution=node"
      - "src/mcp/server.ts"
    env:
      SUPABASE_URL: $SUPABASE_URL
      SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
      SUPABASE_SERVICE_ROLE_KEY: $SUPABASE_SERVICE_ROLE_KEY
      VAULT_ENCRYPTION_KEY: $VAULT_ENCRYPTION_KEY
      OPENAI_API_KEY: $OPENAI_API_KEY
      ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY

  # Filesystem — read/write access to project root
  - name: filesystem
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "c:/Users/lucas/OneDrive/Dalizebo Holdings/imperial_codex"

  # Git — repository operations
  - name: git
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-git"
      - "--repository"
      - "c:/Users/lucas/OneDrive/Dalizebo Holdings/imperial_codex"

  # Sequential Thinking — structured multi-step reasoning
  - name: sequential-thinking
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-sequentialthinking"

  # Time — timezone-aware time tools
  - name: time
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-time"

  # Brave Search — web search (requires BRAVE_API_KEY)
  - name: brave-search
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: $BRAVE_API_KEY

  # GitHub — repo read/write via PAT
  - name: github
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: $GITHUB_TOKEN

# ----------------------------------------------------------
# CONTEXT PROVIDERS — what @-mentions are available in chat
# ----------------------------------------------------------
contextProviders:
  # @codebase — semantic search across the whole repo
  - name: codebase
    params:
      nRetrieve: 25
      nFinal: 5
      useReranking: true

  # @code — paste a specific symbol or file range
  - name: code

  # @file — include a full file
  - name: file

  # @folder — include all files in a folder
  - name: folder

  # @docs — search indexed documentation sites
  - name: docs

  # @diff — current git diff
  - name: diff

  # @terminal — last terminal output
  - name: terminal

  # @problems — VS Code diagnostics panel
  - name: problems

  # @os — operating system info
  - name: os

  # @repo-map — high-level project structure summary
  - name: repo-map
    params:
      includeSignatures: true

  # @open — currently open editor tabs
  - name: open
    params:
      onlyPinned: false

  # @web — live web search (uses Brave via MCP when key set)
  - name: web
    params:
      n: 5

  # @github — PR, issue, commit search
  - name: github
    params:
      repos:
        - $GITHUB_REPO

# ----------------------------------------------------------
# SLASH COMMANDS
# ----------------------------------------------------------
slashCommands:
  - name: edit
    description: Edit selected code in place

  - name: comment
    description: Write JSDoc / TSDoc comments for selected code

  - name: share
    description: Export the current chat session to markdown

  - name: cmd
    description: Generate a shell command from a plain-English description

  - name: commit
    description: Generate a Conventional Commit message from the current diff

  - name: test
    description: Write Jest unit tests for the selected code

  - name: review
    description: Code-review the selection and suggest improvements

  - name: explain
    description: Step-by-step explanation of the selected code

  - name: optimize
    description: Identify and fix performance issues in the selection

  - name: fix
    description: Diagnose and patch errors or bugs in the selection

# ----------------------------------------------------------
# RULES — system-level guidance injected into every session
# ----------------------------------------------------------
rules:
  - name: imperial-codex-stack
    rule: |
      This is imperial_codex, a Next.js 16.2 / React 19 / TypeScript 5 project.
      Runtime: Node.js 20 LTS.
      Package manager: npm (never yarn or pnpm).
      Database: Supabase (PostgreSQL). All write operations use exponential back-off:
        base 500 ms, cap 5000 ms, max 2 retries.
      Caching: Redis.
      Vector search: Qdrant (primary) and Pinecone (secondary).
      AI: OpenAI GPT-4o via Vercel AI SDK (primary), Anthropic Claude 3.5 Sonnet (secondary).
      Embeddings: text-embedding-3-large (1536 dims).
      Auth: iron-session cookie-based sessions, clearance levels 0–2.
      Encryption: AES-256-GCM for vault data.
      Styling: Tailwind CSS.
      Tests: Jest + ts-jest + fast-check (property-based).

  - name: code-conventions
    rule: |
      - File names: kebab-case for directories and non-component files.
      - React components: PascalCase (e.g., ChatWidget.tsx).
      - JSON data files: SNAKE_UPPER_CASE (e.g., CAPITAL_ALLOCATIONS.json).
      - All source code lives under src/.
      - Never commit .env, .p12, .pem, .key, or auth.json files.
      - Use exact / pinned dependency versions in package.json.
      - Prefer parameterized queries; never interpolate user input into SQL.
      - All AI API calls must have a fallback strategy.

  - name: testing-standards
    rule: |
      - Write Jest tests for every new function or module.
      - Use fast-check for property-based tests on pure functions.
      - Run: npm test (single run, no watch mode in agent tasks).
      - Type-check with: npm run typecheck before marking a task done.
      - Lint with: npm run lint before committing.

  - name: git-hygiene
    rule: |
      - Commit messages follow Conventional Commits:
          <type>(<scope>): <short summary>
          Types: feat | fix | docs | style | refactor | test | chore
      - Never push directly to main. Always create a feature branch.
      - Stage specific files — avoid `git add .` unless intentional.

