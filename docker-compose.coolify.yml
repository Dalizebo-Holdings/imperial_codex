version: '3.8'

services:
  imperial-codex:
    image: imperial-codex:latest
    container_name: imperial-codex-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    env_file:
      - .env.production.local
    volumes:
      - ./core:/app/core:ro
      - ./vault:/app/vault:ro
      - ./rituals:/app/rituals:ro
      - /tmp/app-cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=imperial-codex,env=production"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - coolify-network

networks:
  coolify-network:
    driver: bridge
