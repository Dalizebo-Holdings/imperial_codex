version: '3.9'

services:
  # Qwen 2.5 7B — primary model
  qwen36:
    image: ollama/ollama:latest
    container_name: qwen36
    ports:
      - "8001:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=4
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - qwen36_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 5g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Phi-4 mini — fallback model
  phi4mini:
    image: ollama/ollama:latest
    container_name: phi4mini
    ports:
      - "8002:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREAD=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - phi4mini_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 3g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  qwen36_models:
    driver: local
  phi4mini_models:
    driver: local
