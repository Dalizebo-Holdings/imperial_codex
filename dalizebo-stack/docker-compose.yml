version: "3.9"

# =============================================================================
# DALIZEBO.CO.ZA - 10 PILLARS FULL STACK
# Modern, Secure, Self-Healing Infrastructure
# =============================================================================

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-restart-policy: &restart-policy
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

networks:
  proxy:
    name: dalizebo-proxy
    external: true
  internal:
    name: dalizebo-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  vaultwarden_data:
  nextcloud_data:
  chatwoot_data:
  erpnext_data:
  gitea_data:
  ollama_data:
  grafana_data:
  prometheus_data:
  loki_data:
  agent_workspace:
  supplier_repo:
  vendor_repo:
  codex_data:
  backups:

services:
  # ===========================================================================
  # TRAEFIK REVERSE PROXY (Required for all services)
  # ===========================================================================
  
  traefik:
    image: traefik:v3.0.0
    container_name: dalizebo-traefik
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./logs/traefik:/logs
      - ./configs/traefik/acme.json:/letsencrypt/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$change$$me}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ===========================================================================
  # PILLAR 1: EXECUTIVE COCKPIT & OBSERVABILITY
  # ===========================================================================
  
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: dalizebo-prometheus
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15}d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Grafana - Executive Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: dalizebo-grafana
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://cockpit.${DOMAIN}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`cockpit.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: dalizebo-node-exporter
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # Uptime Kuma - Service Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.10
    container_name: dalizebo-uptime-kuma
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - ./data/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # PILLAR 2: MANAGER'S OFFICE & OPERATIONAL SUITE
  # ===========================================================================

  # Nextcloud - File Management & Collaboration
  nextcloud:
    image: nextcloud:29.0.0
    container_name: dalizebo-nextcloud
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - nextcloud_data:/var/www/html
      - ./data/nextcloud/apps:/var/www/html/custom_apps
      - ./data/nextcloud/config:/var/www/html/config
      - ./data/nextcloud/data:/var/www/html/data
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`office.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-dav"
      - "traefik.http.middlewares.nextcloud-dav.headers.customrequestheaders.X-Forwarded-Proto=https"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Vaultwarden - Password Manager
  vaultwarden:
    image: dani-garcia/vaultwarden:latest
    container_name: dalizebo-vaultwarden
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUP_ALLOWED=${SIGNUP_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${INVITATIONS_ALLOWED:-true}
      - DOMAIN=https://vault.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Chatwoot - Customer Success Engine
  chatwoot:
    image: chatwoot/chatwoot:v3.8.0
    container_name: dalizebo-chatwoot
    <<: [*restart-policy]
    logging: *default-logging
    networks: [proxy, internal]
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    volumes:
      - chatwoot_data:/app/storage
    environment:
      - FRONTEND_URL=https://chat.${DOMAIN}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - INSTALLATION_IDENTIFIER=${CHATWOOT_INSTALLATION_IDENTIFIER}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.chatwoot.entrypoints=websecure"
      - "traefik.http.routers.chatwoot.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  chatwoot-postgres:
    image: postgres:15-alpine
    container_name: dalizebo-chatwoot-db
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ./data/chatwoot/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  chatwoot-redis:
    image: redis:7-alpine
    container_name: dalizebo-chatwoot-redis
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # ===========================================================================
  # PILLAR 3: FINTECH, BANKING, ACCOUNTING (ERPNext)
  # ===========================================================================

  erpnext:
    image: frappe/erpnext:version-15
    container_name: dalizebo-erpnext
    <<: [*restart-policy]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - erpnext_data:/home/frappe/frappe-bench/sites
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erp.${DOMAIN}`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ===========================================================================
  # PILLAR 4: STOREFRONT & SUPPLIERS (Supabase Backend)
  # ===========================================================================

  supabase-db:
    image: supabase/postgres:15.1.0.117
    container_name: dalizebo-supabase-db
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ./data/supabase/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  supabase-studio:
    image: supabase/studio:20240422-5d8c18b
    container_name: dalizebo-supabase-studio
    <<: [*restart-policy]
    logging: *default-logging
    networks: [proxy, internal]
    environment:
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DEFAULT_ORGANIZATION_NAME=Dalizebo
      - DEFAULT_PROJECT_NAME=Storefront
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supabase-studio.rule=Host(`studio.${DOMAIN}`)"
      - "traefik.http.routers.supabase-studio.entrypoints=websecure"
      - "traefik.http.routers.supabase-studio.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  supabase-meta:
    image: supabase/pgmeta:v0.83.2
    container_name: dalizebo-supabase-meta
    <<: [*restart-policy]
    logging: *default-logging
    networks: [internal]
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_NAME=postgres
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  # ===========================================================================
  # PILLAR 5: AI DIGITAL TWIN (Ollama + Agent Workspace)
  # ===========================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: dalizebo-ollama
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ollama_data:/root/.ollama
      - ./configs/ollama/models:/models
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_MODELS=/models
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===========================================================================
  # PILLAR 7: MARKETING & TRAFFIC (n8n Automation)
  # ===========================================================================

  n8n:
    image: n8nio/n8n:latest
    container_name: dalizebo-n8n
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - ./data/n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ===========================================================================
  # PILLAR 8: SECURITY (CrowdSec + Traefik)
  # ===========================================================================

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.0
    container_name: dalizebo-crowdsec
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - ./configs/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./configs/crowdsec/local:/var/lib/crowdsec/data
      - ./configs/crowdsec/config:/etc/crowdsec
      - /var/log:/var/log:ro
      - /var/run/faillock:/var/run/faillock:ro
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # PILLAR 9: R&D & CI/CD (Gitea + Drone)
  # ===========================================================================

  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: dalizebo-gitea
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [proxy, internal]
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${DB_PASSWORD}
      - GITEA__root__PASSWORD=${GITEA_ROOT_PASSWORD}
      - GITEA__server__DOMAIN=git.${DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gitea.service.port=3000"
      - "traefik.tcp.routers.gitea-ssh.rule=HostSNI(`git.${DOMAIN}`)"
      - "traefik.tcp.routers.gitea-ssh.entrypoints=ssh"
      - "traefik.tcp.routers.gitea-ssh.service.port=22"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  gitea-db:
    image: postgres:15-alpine
    container_name: dalizebo-gitea-db
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ./data/gitea/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # SHARED INFRASTRUCTURE
  # ===========================================================================

  # Redis (Shared cache for multiple services)
  redis:
    image: redis:7-alpine
    container_name: dalizebo-redis
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - redis_data:/data
      - ./configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # PostgreSQL (Shared DB for multiple services)
  postgres:
    image: postgres:15-alpine
    container_name: dalizebo-postgres
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=dalizebo_main
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Meilisearch (Search Engine for Storefront/Docs)
  meilisearch:
    image: getmeili/meilisearch:v1.7.0
    container_name: dalizebo-meilisearch
    <<: [*restart-policy, *healthcheck-defaults]
    logging: *default-logging
    networks: [internal]
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-CHANGE_ME_MEILI_KEY}
      - MEILI_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Backup Service (Automated nightly backups)
  backup-runner:
    image: alpine:latest
    container_name: dalizebo-backup-runner
    <<: [*restart-policy]
    logging: *default-logging
    networks: [internal]
    volumes:
      - ./backups:/backups
      - postgres_data:/source/postgres:ro
      - vaultwarden_data:/source/vaultwarden:ro
      - nextcloud_data:/source/nextcloud:ro
    environment:
      - ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache rsync borgbackup tar gzip
        echo "Backup service initialized. Run manually or via cron."
        tail -f /dev/null
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # Storage Monitor & Auto-Prune
  storage-monitor:
    image: alpine:latest
    container_name: dalizebo-storage-monitor
    <<: [*restart-policy]
    logging: *default-logging
    networks: [internal]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli coreutils
        echo "Storage monitor initialized."
        while true; do
          USAGE=$$(df / | awk 'NR==2 {print $$5}' | sed 's/%//')
          if [ "$$USAGE" -gt 85 ]; then
            echo "Disk usage at $$USAGE%. Running prune..."
            docker system prune -af --volumes --filter "until=24h"
          fi
          sleep 3600
        done
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
